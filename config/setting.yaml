# 全局路径管理
paths:
  data_dir: "./data"
  db_dir: "./data/db"
  vector_store: "./data/vector/chroma"
  recipes_dir: "./data/recipes"
  log_dir: "./logs"

# MCP Server 交互配置 (Agent 调用 Server 的凭证)
mcp:
  transport: "stdio"          # stdio | http
  command: "python"           # 启动 server 的命令
  args: ["src/mcp/server.py"] # server 入口路径
  env:                        # 传递给子进程的环境变量
    PYTHONPATH: "."

# 离线摄取流水线配置
ingestion:
  chunk_size: 1000            # 基于字符或标记的切块大小
  chunk_overlap: 100          # 块之间重叠大小
  enrichment:                 # Transformer 阶段配置
    use_llm_summary: true     # 是否调用 LLM 生成切片摘要
    extract_metadata: true    # 是否自动提取食材标签/难度

# 检索与 RAG 核心
retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10
  # §5.1 阶段一：top1 相对 top2 分数优势超过该比例则高置信锁定（与 researcher 一致）
  confidence:
    top2_relative_gap: 0.15
  # §5.1 / FR-22：歧义分支展示的最大候选数（有限列表 + 序号选择）
  ambiguity:
    max_candidates: 6
  # FR-24：首轮无结果时，额外使用「放宽软约束」的检索次数（仍保留 hard_exclusions / §5.4）
  empty_search:
    soft_retry_max: 1
  rerank:
    enabled: true             # 增加开关，方便调试时跳过精排
    backend: cross_encoder 
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    threshold: 0.5            # 丢弃低于该分的检索结果

# 本地业务数据库配置 (SQLite)
databases:
  user_profiles: "user_profiles.db"
  inventory: "inventory.db"
  ingestion_history: "ingestion_history.db"
  
# LLM 配置
llm:
  provider: dashscope             # 阿里云百炼 (DashScope)
  model: qwen-max             
  rerank_model: qwen3-vl-rerank
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1" # 百炼的 OpenAI 兼容端点
  api_key: "${DASHSCOPE_API_KEY}" # 从环境变量读取 API KEY
  
  # 运行参数调优
  temperature: 0.7                # 创意与严谨的平衡
  max_tokens: 2000                # 单次生成最大长度
  timeout: 60                     # 旗舰模型推理较重，建议增加超时阈值
  retry_limit: 3                  # 遇到网络抖动自动重试

# 家庭 / 用户作用域（规格 §3.2、§8：画像与库存 SCOPE_ID）
household:
  default_id: "default_user"

# 库存补货（规格 §6.5、§8）
inventory:
  restock:
    confirm_required: true   # true：仅预览，用户确认后再写库；false：单条高置信时可免确认（见 Settings）

# 意图与置信度（规格 §8；FR-03 / §12.6）
intent:
  confidence:
    clarify_threshold: 0.55       # 低于则 needs_clarification；禁触发写库类任务展开

# L3 当轮约束（规格 §4.3；T-010）：关键词 → 约束行，供 memory_state 与检索 query 增强
memory:
  l3:
    keyword_rules:
      - keywords: ["肠胃", "胃不舒服", "胃疼", "胃炎", "拉肚子", "腹泻"]
        constraint: "短期：肠胃不适，宜清淡易消化"
      - keywords: ["感冒", "发烧", "咳嗽", "嗓子疼", "喉咙痛"]
        constraint: "短期：感冒/呼吸道不适"
      - keywords: ["清淡", "少油", "少盐", "低油", "低盐"]
        constraint: "口味：清淡饮食"
      - keywords: ["忌口", "不能吃", "不吃", "禁食"]
        constraint: "医嘱/自我约束：忌口需遵守"
      - keywords: ["牙疼", "拔牙", "口腔"]
        constraint: "短期：口腔不适期"
      - keywords: ["孕妇", "怀孕", "孕期", "月子", "产后"]
        constraint: "特殊阶段：孕产期饮食需谨慎"
      - keywords: ["术后", "刚做完手术", "手术恢复"]
        constraint: "短期：术后恢复期"
      - keywords: ["过敏", "过敏原", "不耐受"]
        constraint: "安全：过敏相关表述需结合画像核对"

  # 短期状态 TTL（规格 §3.4；FR-13；T-013）
  short_term_ttl:
    default_days: 7              # 写入 user_short_term_states 的默认过期天数（与代码默认一致可调）
    purge_expired_on_turn: true  # 每轮 L3 前物理删除本 scope 过期/失活行

  # L2 摘要窗口（规格 §8 memory.summary.*；与 conversation_summary 节点对齐）
  summary:
    window_size: 4
    compress_trigger: 8

# 菜谱解析元数据（规格 §8 recipe.parser_version；运行时常量可由 researcher 覆盖写入 state）
recipe:
  parser_version: "llm_structured_v1"
  # 与 retrieval.confidence.top2_relative_gap 同一语义（§8「recipe.confidence.gap_ratio」）；单一真相源见 retrieval
  confidence:
    gap_ratio: 0.15

# Embedding 配置
embedding:
  provider: dashscope             # 百炼
  model: text-embedding-v4
  api_key: "${DASHSCOPE_API_KEY}"
  
# 向量存储配置
vector_store:
  backend: chroma           # chroma | qdrant | pinecone
  persist_path: ./data/db/chroma

# 重排配置（全局别名；RAG 管线若读取请与 retrieval.rerank 区分）
rerank:
  backend: cross_encoder    # none | cross_encoder | llm
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_m: 30

# 评估配置
evaluation:
  backends: [ragas, custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

# 可观测性配置（NFR-06 / NFR-07）
observability:
  enabled: true
  structured_agent_log: true   # 节点级 JSON 行日志：会话、耗时、错误码
  memory_metrics_log: true     # 每轮 generator 结束输出 L2/L3/L4 汇总指标
  log_file: ./logs/traces.jsonl

# Dashboard 管理平台配置
dashboard:
  enabled: true
  port: 8501                     # Streamlit 服务端口
  traces_dir: ./logs             # Trace 日志文件目录
  auto_refresh: true             # 是否自动刷新（轮询新 trace）
  refresh_interval: 5            # 自动刷新间隔（秒）